# IGRIS-C RGB 카메라 4개 (별도 override 레이어 igris_cameras.usda; 로봇 USD·물리 무변경). 출발점 = ROBROS 공식 robot_cfg.py(b53e424).
# 공식 USD 시각 메시(from_urdf STL)에는 눈 구멍·손바닥 구멍이 없고 공식 광학 중심 4개가 모두 닫힌 셸 내부에 있다(data/isaac/camera_probe/probe.json).
#  - 머리: 앞 셸까지 17.6–25.9 mm → 공식 near clip 0.05 m 가 셸을 통과시키므로 공식 값 그대로 사용(위치 무수정).
#  - 손: 앞 셸까지 5.7–8.1 mm, 공식 near clip 0.001 m 로는 자기 셸 내부가 보임 → 광학 중심을 광축 방향으로 +10 mm 옮겨 셸 표면 바로 밖(표면 +2 mm, 실제 렌즈 위치)에 두고 near clip 0.02 m.
#    메시 광선 검사(FOV 격자 자기 메시 충돌 비율, probe off_*): +10 mm → <2cm 6.7%/<3cm 12–14% · +15 mm → 1%/7% · +20 mm → 0%/1.3–1.9%. 선택 +10 mm(공식 extrinsic에 가장 근접) + near 0.02(2 cm 이내 손바닥 셸 가장자리 제거).
#    수정 전/후 값은 아래 `official_pos`/`axial_offset_m` 에 남긴다. 실제 렌더에서 자기 메시 가림(depth<0.03 m 비율)로 재검증한다.
enabled: true
head:
  left:
    prim: LeftRgbCamera            # /World/envs/env_0/IGRIS_C/Link_Neck_Pitch/LeftRgbCamera
    link: Link_Neck_Pitch
    width: 640
    height: 480
    intrinsic: [433.3, 433.3, 320.0, 240.0]   # fx, fy, cx, cy (공식)
    distortion: [0, 0, 0, 0, 0]                # 공식: 왜곡 없음(from_intrinsic_matrix)
    clipping: [0.05, 100.0]
    official_pos: [0.095516, 0.026076, 0.121]
    axial_offset_m: 0.0
    rot_mode: {base: [0.5, -0.5, 0.5, -0.5], axis: [0, 0, 1], deg: 14.0}   # _camera_rotation((0,0,1), +14°): 좌안은 링크 z축 기준 좌측 14°
    convention: ros
  right:
    prim: RightRgbCamera
    link: Link_Neck_Pitch
    width: 640
    height: 480
    intrinsic: [433.3, 433.3, 320.0, 240.0]
    distortion: [0, 0, 0, 0, 0]
    clipping: [0.05, 100.0]
    official_pos: [0.095516, -0.026076, 0.121]
    axial_offset_m: 0.0
    rot_mode: {base: [0.5, -0.5, 0.5, -0.5], axis: [0, 0, 1], deg: -14.0}
    convention: ros
  stereo_output: cam_head          # 좌|우 가로 결합 1280×480 (lerobot_robot_igris: view=left → frame[:, :640])
hands:
  left:
    prim: l_hand_camera_link       # /World/envs/env_0/IGRIS_C/Left_Hand/l_hand_camera_link (USD에 없는 prim → 레이어에서 생성)
    link: Left_Hand
    width: 320
    height: 200
    intrinsic: [115.669608, 115.546655, 159.669481, 96.948254]   # LEFT_WRIST_INTRINSIC (320×200 보정)
    distortion: [0.047115, -0.056155, 0.0, 0.0, 0.012162]         # LEFT_WRIST_DISTORTION k1 k2 p1 p2 k3
    clipping: [0.02, 4.0]                                         # 공식 (0.001, 4.0) → near 0.02 (셸 가장자리 제거; 위 검사 근거)
    official_pos: [-0.024420, 0.010317, 0.034793]
    axial_offset_m: 0.010                                         # 광축 방향 +10 mm (셸 표면 8.0 mm + 여유)
    tilt_yaw_deg: -20.0                                           # 1차 튜닝(2026-09-26): 카메라 자체 z축(world 규약) −20° → 데이터셋 15자세 전부에서 자기 메시(<3 cm) 0%, 외부(0.1–1.5 m) 평균 84%
                                                                  #   (공식 회전 대비 20° 편차, 위치 편차 10 mm). 후보 비교: docs/results/hand_camera_tuning.json. 광축 주위 회전/표시 회전과 무관
    rot: [0.281491451510162, -0.813343087073706, -0.479715245579771, -0.170613213422809]   # URDF rpy(-2.7823,-0.5795,0.9576)
    convention: world
  right:
    prim: r_hand_camera_link
    link: Right_Hand
    width: 320
    height: 200
    intrinsic: [115.459869, 115.422582, 157.159381, 91.929442]   # RIGHT_WRIST_INTRINSIC
    distortion: [0.044201, -0.057607, -0.000818, 0.000326, 0.012698]
    clipping: [0.02, 4.0]
    official_pos: [-0.024420, -0.010317, 0.034793]
    axial_offset_m: 0.010
    # 오른손은 미변경: 데이터셋 15자세 모두 오른팔이 몸 옆 휴식 자세라 검증 불가. 시험한 후보(off20/30, pitch/yaw ±20/40, 조합) 어느 것도 자기 메시 17% 미만·외부 25% 초과를 못 넘음 → 공식 값 유지
    rot: [0.280192038750642, 0.813790055664715, -0.479987262874607, 0.169854037927043]     # URDF rpy(2.7845,-0.5769,-0.9588)
    convention: world
  # 학습 데이터셋(igris_c_trainer sample_dataset: cam_left/cam_right 640×480)에 맞춘 추가 출력. 실기 640×480 카메라의 내부 파라미터는 제공되지 않았다.
  #  extend   : 같은 렌즈 모델로 센서를 2배 확대(fx,fy,cx,cy ×2 → 640×400 상당) + 세로 80 px 추가(cy+40). 수평 FOV 동일(108.3°), 수직 FOV 81.7°→92.2°(상하 40 px는 보정 범위 밖 외삽).
  #  letterbox: 640×400(×2) 렌더 후 상하 40 px 검은 띠 → FOV·종횡비 보존, 유효 화소 83%.
  #  none     : 320×200 공식 출력만.
  train_output: {mode: extend, width: 640, height: 480, names: {left: cam_left, right: cam_right}}
capture:
  moving_frame_time_s: 0.83        # arm_test 사인파(0.3 Hz) 최대 변위 시각(=1/(4f))
  self_occlusion_depth_m: 0.03     # 이 거리 안의 화소 비율 = 자기 메시 가림 지표
